repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        # Regenerated by EmDash on every build, without a final newline
        exclude: ^emdash/emdash-env\.d\.ts$
      - id: trailing-whitespace

  # Python remains for the logbook data pipeline (scripts/)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix, --show-fixes]
      - id: ruff-format

  # Site photos live in R2 (uploaded through the EmDash admin), but images
  # still get committed, e.g. e2e fixtures: keep location data out of git
  - repo: https://github.com/stefmolin/exif-stripper
    rev: 0.6.1
    hooks:
      - id: strip-exif
