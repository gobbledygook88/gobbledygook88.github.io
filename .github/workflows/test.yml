name: Lint Python

# Lints the logbook data pipeline (scripts/*.py). Deliberately runs on every
# pull request, with no `paths` filter: branch protection on main requires the
# `lint` check, and a filtered-out workflow never reports it, which would block
# merging EmDash-only PRs. The run takes seconds.
on: pull_request

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run ruff
        run: uv run ruff check
      - name: Check imports
        run: uv run ruff check --select I
