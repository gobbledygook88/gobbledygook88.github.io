name: EmDash site

# - Pull requests: a Workers Preview named pr-<number>, deleted when the PR closes
# - main (continuous deployment): tests, then staging, then production. Each
#   deploy migrates its own D1 database first. Staging backs the PR previews.
#
# Previews (not version URLs: those aren't generated for Workers with Durable
# Objects) use the `previews` block in emdash/wrangler.jsonc, which points at
# the *staging* D1/R2/KV — never production.

on:
  push:
    branches: ["main"]
    paths: ["emdash/**", ".github/workflows/emdash.yml"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: ["emdash/**", ".github/workflows/emdash.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Explicit bash runs steps with -eo pipefail, so piped failures can't be hidden
    shell: bash
    working-directory: emdash

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version-file: emdash/.nvmrc
          cache: pnpm
          cache-dependency-path: emdash/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Test the legacy content importer
        run: pnpm test:import
      - run: pnpm build

  # Outside-in browser tests against the built Worker (`wrangler dev`, local
  # database, no Cloudflare credentials needed)
  e2e:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version-file: emdash/.nvmrc
          cache: pnpm
          cache-dependency-path: emdash/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: emdash/test-results/
          retention-days: 7

  preview:
    # Secrets aren't available to fork or Dependabot PRs
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: emdash-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version-file: emdash/.nvmrc
          cache: pnpm
          cache-dependency-path: emdash/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Build again rather than share dist/: the build also writes
      # .wrangler/deploy/config.json, which points wrangler at dist/server/wrangler.json
      - run: pnpm build
      # Previews don't run migrations: they share the staging database, which
      # only main migrates. A PR that upgrades EmDash will show "migrations
      # required" in its Preview until it merges.
      - name: Deploy Preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pnpm wrangler preview \
            --name "pr-${PR_NUMBER}" \
            --tag "${COMMIT_SHA::7}" \
            --message "PR #${PR_NUMBER}" \
            --ignore-base-config \
            --json > preview.out
          # Wrangler logs to stdout too; the JSON result starts at the last bare "{" line
          awk '/^\{$/ { buf = "" } { buf = buf $0 "\n" } END { printf "%s", buf }' preview.out > preview.json
          preview_url=$(jq -r '.preview.urls[0] // empty' preview.json)
          deployment_url=$(jq -r '.deployment.urls[0] // empty' preview.json)
          if [ -z "$preview_url" ]; then
            cat preview.out
            echo "::error::No Preview URL in wrangler output"
            exit 1
          fi
          echo "preview_url=${preview_url}" >> "$GITHUB_OUTPUT"
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"
      - name: Check the Preview responds
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: curl --fail --show-error --silent --output /dev/null --retry 3 --retry-all-errors "$PREVIEW_URL/"
      - name: Comment Preview URL on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          DEPLOYMENT_URL: ${{ steps.preview.outputs.deployment_url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body=$(cat <<EOF
          ### EmDash preview

          | | |
          |---|---|
          | Preview (latest commit) | ${PREVIEW_URL} |
          | This deployment | ${DEPLOYMENT_URL:-n/a} |
          | Commit | \`${COMMIT_SHA::7}\` |

          Shares the **staging** database and media bucket. For checking public
          pages: admin passkeys are tied to the staging hostname, so log in there.
          EOF
          )
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$body"

  cleanup-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version-file: emdash/.nvmrc
          cache: pnpm
          cache-dependency-path: emdash/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Delete Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pnpm wrangler preview delete --name "pr-${PR_NUMBER}" --skip-confirmation \
            || echo "::warning::Could not delete Preview pr-${PR_NUMBER} (it may never have been created)"

  deploy-staging:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Don't deploy a build whose browser tests fail
    needs: [check, e2e]
    runs-on: ubuntu-latest
    environment:
      name: emdash-staging
      url: https://biscuit-crumbs-staging.marcusmo88.workers.dev
    concurrency:
      group: emdash-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version-file: emdash/.nvmrc
          cache: pnpm
          cache-dependency-path: emdash/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Build again rather than share dist/: the build also writes
      # .wrangler/deploy/config.json, which points wrangler at dist/server/wrangler.json
      - run: pnpm build
      # EmDash D1 migrations are deployment-managed: the Worker won't run them
      # reliably on its own (a fresh DB stalled mid-way on first request).
      # The build writes the manifest to .emdash/migrations.json.
      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          migration_status=$(pnpm exec emdash migrate --status --json --wrangler-config wrangler.jsonc)
          echo "$migration_status" | jq '{target: .target.label, pending: .pending, unknownApplied: .unknownApplied}'
          fingerprint=$(echo "$migration_status" | jq -r '.target.fingerprint')
          pnpm exec emdash migrate --wrangler-config wrangler.jsonc \
            --expected-target-fingerprint "$fingerprint"
      - name: Deploy to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm wrangler deploy --message "main@${GITHUB_SHA::7}"

  deploy-production:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Staging first: it keeps the previews' database migrated and catches a bad deploy
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: emdash-production
      url: https://marcusmo.co.uk
    concurrency:
      group: emdash-production
      cancel-in-progress: false
    env:
      # Build for (and point wrangler at) env.production in wrangler.jsonc
      CLOUDFLARE_ENV: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version-file: emdash/.nvmrc
          cache: pnpm
          cache-dependency-path: emdash/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          migration_status=$(pnpm exec emdash migrate --status --json --wrangler-config wrangler.jsonc --wrangler-env production)
          echo "$migration_status" | jq '{target: .target.label, pending: .pending, unknownApplied: .unknownApplied}'
          fingerprint=$(echo "$migration_status" | jq -r '.target.fingerprint')
          pnpm exec emdash migrate --wrangler-config wrangler.jsonc --wrangler-env production \
            --expected-target-fingerprint "$fingerprint"
      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm wrangler deploy --message "main@${GITHUB_SHA::7}"
